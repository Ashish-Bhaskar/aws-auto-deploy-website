
name: DevOps Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-website:
    runs-on: ubuntu-latest

    steps:
      - name: Download website code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -f index.html
          grep -q "MY DEVOPS CLOUD LAB" index.html
          grep -q "Version 2.0" index.html
          echo "All website checks passed!"
