
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My DevOps Cloud Lab</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #081327, #172554);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      padding: 45px;
      margin: 20px;
      border: 1px solid #38bdf8;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 45px rgba(56,189,248,0.15);
    }
    h1 { color: #38bdf8; }
    .status { color: #4ade80; font-weight: bold; }
    .version { color: #facc15; font-size: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 MY DEVOPS CLOUD LAB</h1>
    <h2>GitHub + AWS Amplify</h2>
    <p class="status">● Deployment Status: LIVE</p>
    <p class="version">Version 1.0</p>
    <p>Learning DevOps through real projects!</p>
    <p>Powered by GitHub and AWS</p>
  </div>
</body>
</html>
